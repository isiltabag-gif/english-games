<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 23 Reading Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#a8edea,#fed6e3);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #16a085}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#16a085;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#e8f8f5;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#e8f8f5}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#16a085;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
.lis{font-size:17px;padding:10px 14px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}
.hint{text-align:center;color:#777;font-size:15px;margin:4px}
.words{font-size:16px;background:#eef6ff;padding:10px;border-radius:12px;line-height:1.5}
.write{font-size:18px;line-height:1.5;background:#fff8e7;padding:12px;border-radius:12px}
textarea{width:100%;min-height:110px;font-size:17px;padding:10px;border:2px solid #ddd;border-radius:12px;box-sizing:border-box;font-family:Arial,sans-serif}
.sample{font-size:17px;line-height:1.5;background:#e8f8f5;padding:12px;border-radius:12px;margin-top:10px;display:none}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[{"t": "👧 Card 1: The New Girl", "s": "On Wednesday, a new girl comes to school. Her name is Alexis. She has a big smile and a red backpack. She sits next to JB in math class. JB looks at her and forgets his pencil. Josh laughs. \"JB likes the new girl!\" he thinks.", "q": [["What is the new girl's name?", ["Crystal", "Alexis", "Mom", "Coach"], 1], ["What color is her backpack?", ["Red", "Blue", "Green", "Black"], 0], ["Where does she sit?", ["Next to Josh", "Next to Coach", "Next to JB", "At the door"], 2], ["What is this card mostly about?", ["Josh loses his pencil", "A new girl comes and JB likes her", "The math test is hard", "The twins play basketball"], 1]]}, {"t": "🏀 Card 2: Josh Plays Alone", "s": "After school, Josh goes to the driveway with the ball. He waits for JB. But JB is at the park with Alexis. Josh shoots the ball alone. One shot, two shots, ten shots. It is not fun without his brother. Josh feels sad and a little angry.", "q": [["Where does Josh go after school?", ["To the driveway", "To the store", "To the doctor", "To Coach's house"], 0], ["Where is JB?", ["In his room", "At the park with Alexis", "At practice", "In the kitchen"], 1], ["How many shots does Josh take?", ["One", "Two", "Five", "Ten"], 3], ["How does Josh feel?", ["Happy and excited", "Tired and hungry", "Sad and a little angry", "Scared and cold"], 2]]}, {"t": "🏆 Card 3: The Final", "s": "At practice, Coach says, \"Great news, team! We play in the final in two weeks!\" Everyone cheers. Then Coach looks at Josh and JB. \"You two are a great team,\" he says. \"Play together.\" Josh looks at JB. JB looks at his phone.", "q": [["When is the final?", ["Tomorrow", "In two weeks", "On Monday", "Next year"], 1], ["What does everyone do?", ["They cry", "They go home", "They cheer", "They sleep"], 2], ["What does JB look at?", ["His phone", "The ball", "Coach", "Alexis"], 0], ["What is this card mostly about?", ["Coach is sick", "The team gets new shoes", "Josh scores a basket", "The team will play in the final, but the twins are not close"], 3]]}];
let k=-1,j=0,score=0,total=12,wrong=[],phase='read';const c=document.getElementById('c');
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function play(id,slow){stopA();A=new Audio('audio/gun23_'+id+(slow?'_slow':'')+'.mp3');A.play()}
function show(){
if(k<0){c.innerHTML=`<h2>🏀 Day 23: A New Girl at School</h2><p class="story">The team won the semifinal! 🏆 Dad is walking every day. 🚶 But today, something new happens at school... and Josh is not happy! 😠 Read, listen and find out!</p><p class="words"><b>🔑 Yeni kelimeler:</b><br>new = yeni · backpack = sırt çantası · forget = unutmak<br>driveway = garaj yolu · alone = yalnız · without = olmadan<br>angry = kızgın · final = final maçı · cheer = tezahürat yapmak</p><p class="hint">3 kart · 12 soru · her doğru = ⭐ · ~20 dakika</p><button id="next" style="display:block;margin-top:12px" onclick="k=0;show()">Başla ▶️</button>`;return}
if(k>=S.length){finish();return}
const x=S[k],q=x.q[j];
c.innerHTML=`<div class="top"><span>Kart ${k+1}/3 · Soru ${j+1}/4</span><span>⭐ ${score}</span></div><h2>${x.t}</h2><p class="story">${x.s}</p><div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('card'+(k+1),0)">🔊 Dinle</button> <button class="lis" onclick="play('card'+(k+1),1)">🐢 Yavaş dinle</button></div><p class="q">${q[0]}</p>`+
q[1].map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><button id="next" onclick="nx()">Sonraki ➡️</button>`
}
function ans(b,i){const q=S[k].q[j],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q[2]){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Kart '+(k+1)+' Soru '+(j+1)+': '+q[0]+' (Verdiği: '+q[1][i]+', Doğru: '+q[1][q[2]]+')');bs[q[2]].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q[2]];msg.style.color='#e74c3c'}
document.getElementById('next').style.display='block'}
function finish(){stopA();phase='done';
c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=10?'Süpersin! Gerçek bir okuma şampiyonusun! 🎉':score>=7?'Çok iyi! Josh gibi hiç pes etmiyorsun! 👏':'Aferin, bitirdin! Yarın daha da güçlü olacaksın! 💪'}<br><br><span style="font-size:16px;color:#555">Okuma: ${score}/12 ✅<br>Sence Josh ve JB yine iyi bir takım olacak mı? Yakında göreceğiz! 🏀</span></div><button id="next" style="display:block" onclick="k=0;j=0;score=0;wrong=[];phase='read';show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
function nx(){stopA();j++;if(j>=4){j=0;k++}show()}
show();
</script><script src="report.js"></script></body></html>
