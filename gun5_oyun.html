<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 5 Vocabulary Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#e0c3fc,#8ec5fc);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #8e44ad}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#8e44ad;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#f8f0ff;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#f5eaff}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#8e44ad;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
.bl{color:#8e44ad;font-weight:bold}.exp{font-size:17px;line-height:1.6;background:#eef6ff;padding:12px;border-radius:12px;text-align:left}.lis{font-size:19px;padding:10px 16px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}.hint{text-align:center;color:#777;font-size:15px;margin:4px}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[{"s": "A <b>new</b> girl comes to school.", "o": ["eski", "yeni", "büyük", "küçük"], "a": 1, "h": "new = yeni", "title": "🔤 \"new\" ne demek?"}, {"s": "She has a big <b>smile</b>.", "o": ["gülümseme", "ağlama", "çanta", "ayakkabı"], "a": 0, "h": "smile = gülümseme / gülümsemek", "title": "🔤 \"smile\" ne demek?"}, {"s": "Alexis is JB's new <b>friend</b>.", "o": ["öğretmen", "kardeş", "arkadaş", "komşu"], "a": 2, "h": "friend = arkadaş", "title": "🔤 \"friend\" ne demek?"}, {"s": "JB and Alexis eat <b>lunch</b> at school.", "o": ["kahvaltı", "akşam yemeği", "tatlı", "öğle yemeği"], "a": 3, "h": "lunch = öğle yemeği (breakfast = kahvaltı, dinner = akşam yemeği)", "title": "🔤 \"lunch\" ne demek?"}, {"s": "They eat lunch <b>together</b>.", "o": ["birlikte", "yalnız", "hızlı", "sonra"], "a": 0, "h": "together = birlikte", "title": "🔤 \"together\" ne demek?"}, {"s": "Josh sits <b>alone</b>.", "o": ["mutlu", "yalnız", "uzun", "erken"], "a": 1, "h": "alone = yalnız (together'ın tersi!)", "title": "🔤 \"alone\" ne demek?"}, {"s": "Alexis is a little <b>shy</b>. She talks very quietly.", "o": ["utangaç", "kızgın", "komik", "yorgun"], "a": 0, "h": "shy = utangaç", "title": "🔤 \"shy\" ne demek?"}, {"s": "Josh is not happy. His face is red. He is <span class='bl'>___</span>.", "o": ["hungry", "shy", "angry", "new"], "a": 2, "h": "angry = kızgın", "title": "✏️ Boşluğa hangi kelime gelir?"}, {"s": "JB tells a funny joke. Alexis <span class='bl'>___</span>.", "o": ["cries", "laughs", "sleeps", "runs"], "a": 1, "h": "laugh = gülmek (sesli gülmek) → Alexis laughs", "title": "✏️ Boşluğa hangi kelime gelir?"}, {"s": "Josh wants JB to play with him, not with Alexis. Josh is <span class='bl'>___</span>.", "o": ["tall", "early", "quiet", "jealous"], "a": 3, "h": "jealous = kıskanç", "title": "✏️ Boşluğa hangi kelime gelir?"}];
let k=-1,score=0,total=10,wrong=[];const c=document.getElementById('c');
function show(){if(k<0){c.innerHTML=`<h2>🏀 Day 5: The New Girl</h2><p class="story">One day, a new girl comes to school. Her name is Alexis. She has a big smile. JB sees her in the hallway, and he smiles too. Now JB and Alexis eat lunch together every day. Josh sits alone. He is not happy.</p><div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('story',0)">🔊 Dinle</button> <button class="lis" onclick="play('story',1)">🐢 Yavaş dinle</button></div><div class="exp"><b>🔤 Bugün 10 yeni kelime!</b><br>Hikâyeyi oku (veya dinle), sonra her sorudaki kelimenin anlamını bul. Her sorudan sonra kelimeyi dinleyip yüksek sesle tekrar et! 🗣️</div><button id="next" style="display:block;margin-top:12px" onclick="k=0;show()">Başla ▶️</button>`;return}
if(k>=S.length){c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=8?'Süpersin! Kelime ustası oldun! 🎉':score>=6?'Çok iyi! 👏':'Yarın daha iyi olacak! 💪'}</div><button id="next" style="display:block" onclick="k=0;score=0;wrong=[];show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`;return}
const q=S[k];
c.innerHTML=`<div class="top"><span>Soru ${k+1}/${S.length}</span><span>⭐ ${score}</span></div><h2>${q.title}</h2><p class="story">${q.s}</p>`+
q.o.map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><p class="hint" id="hn" style="display:none"></p><div id="au" style="text-align:center;display:none;margin:6px 0"><button class="lis" onclick="say(0)">🔊 Dinle ve tekrar et</button> <button class="lis" onclick="say(1)">🐢 Yavaş dinle</button></div><button id="next" onclick="nx()">Sonraki ➡️</button>`}
function ans(b,i){const q=S[k],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q.a){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Soru '+(k+1)+': '+q.s.replace(/<[^>]+>/g,'')+' (Verdiği: '+q.o[i]+', Doğru: '+q.o[q.a]+')');bs[q.a].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q.a]+') '+q.o[q.a];msg.style.color='#e74c3c'}
const hn=document.getElementById('hn');hn.textContent='💡 '+q.h;hn.style.display='block';document.getElementById('au').style.display='block';
document.getElementById('next').style.display='block'}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function play(id,slow){stopA();A=new Audio('audio/gun5_'+id+(slow?'_slow':'')+'.mp3');A.play()}
function say(slow){play('q'+(k+1),slow)}
function nx(){stopA();k++;show()}
show();
</script><script src="report.js"></script></body></html>
