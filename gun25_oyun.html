<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 25 Grammar Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#ffecd2,#fcb69f);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #e67e22}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#e67e22;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#fff7ee;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#fff3e0}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#e67e22;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
.bl{color:#e67e22;font-weight:bold}.exp{font-size:17px;line-height:1.6;background:#eef6ff;padding:12px;border-radius:12px;text-align:left}.lis{font-size:19px;padding:10px 16px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}.hint{text-align:center;color:#777;font-size:15px;margin:4px}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[{"s": "Yesterday, Josh <span class='bl'>___</span> basketball with JB.", "o": ["play", "played", "plays", "playing"], "a": 1, "h": "Yesterday = dün → geçmiş zaman → play + ed = played"}, {"s": "At practice, JB <span class='bl'>___</span> to Alexis in the stands.", "o": ["waved", "waves", "wave", "waving"], "a": 0, "h": "wave zaten e ile bitiyor → sadece d ekle: waved"}, {"s": "Coach <span class='bl'>___</span> at JB: \"Eyes on the ball!\"", "o": ["shout", "shouts", "shouting", "shouted"], "a": 3, "h": "shout + ed = shouted (bağırdı)"}, {"s": "Last night, Dad <span class='bl'>___</span> in the park.", "o": ["walks", "walked", "walk", "walking"], "a": 1, "h": "Last night = dün gece → walk + ed = walked"}, {"s": "Mom <span class='bl'>___</span> chicken and rice for dinner.", "o": ["cook", "cooks", "cooked", "cooking"], "a": 2, "h": "cook + ed = cooked (pişirdi)"}, {"s": "JB <span class='bl'>___</span> an easy shot. Oh no!", "o": ["missed", "miss", "misses", "missing"], "a": 0, "h": "miss + ed = missed (kaçırdı)"}, {"s": "The ball <span class='bl'>___</span> near the door.", "o": ["stoped", "stops", "stoping", "stopped"], "a": 3, "h": "Kısa fiil: stop → p iki kez → stopped ⚠️"}, {"s": "Josh <span class='bl'>___</span> for JB after practice.", "o": ["wait", "waited", "waits", "waiting"], "a": 1, "h": "wait + ed = waited (bekledi)"}, {"s": "Mom and Dad <span class='bl'>___</span> the game on TV.", "o": ["watched", "watch", "watches", "watching"], "a": 0, "h": "Herkes için aynı! they → watched"}, {"s": "At home, the brothers <span class='bl'>___</span> a lot.", "o": ["laugh", "laughs", "laughed", "laughing"], "a": 2, "h": "Geçmiş zamanda he/they fark etmez: laughed"}];
const EXP="<b>📘 Bugünün konusu: Geçmiş Zaman (Past Simple) – düzenli fiiller (-ed)</b><br>DÜN ya da GEÇMİŞTE olan bir şeyi anlatır. (Türkçede: oynadı, yürüdü)<br><br>👉 Fiil + <b>ed</b>: <i>play → played, walk → walked</i><br>👉 Fiil <b>e</b> ile bitiyorsa sadece <b>d</b>: <i>wave → waved</i><br>👉 Kısa fiillerde son harf iki kez: <i>stop → stopped</i><br><br>✅ Herkes için AYNI! <i>I played, he played, they played</i> (s yok, am/is/are yok)<br><br>💡 İpucu kelimeler: <b>yesterday</b> (dün), <b>last night</b> (dün gece)";
let k=-1,score=0,total=10,wrong=[];const c=document.getElementById('c');
function show(){if(k<0){c.innerHTML=`<h2>🏀 Day 25: What Happened Yesterday?</h2><p class="story">Yesterday was a bad day at practice. JB waved to Alexis and missed the ball. Coach shouted. 😬 Now it is night, and Josh is thinking about yesterday. Today, let's learn how to talk about the PAST!</p><div class="exp">${EXP}</div><button id="next" style="display:block;margin-top:12px" onclick="k=0;show()">Başla ▶️</button>`;return}
if(k>=S.length){c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=8?'Süpersin! Geçmiş zaman (-ed) ustası oldun! 🎉':score>=6?'Çok iyi! 👏':'Yarın daha iyi olacak! 💪'}</div><button id="next" style="display:block" onclick="k=0;score=0;wrong=[];show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`;return}
const q=S[k];
c.innerHTML=`<div class="top"><span>Soru ${k+1}/${S.length}</span><span>⭐ ${score}</span></div><h2>✏️ Boşluğa ne gelir?</h2><p class="story">${q.s}</p>`+
q.o.map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><p class="hint" id="hn" style="display:none"></p><div id="au" style="text-align:center;display:none;margin:6px 0"><button class="lis" onclick="say(0)">🔊 Cümleyi dinle</button> <button class="lis" onclick="say(1)">🐢 Yavaş dinle</button></div><button id="next" onclick="nx()">Sonraki ➡️</button>`}
function ans(b,i){const q=S[k],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q.a){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Soru '+(k+1)+': '+q.s.replace(/<[^>]+>/g,'')+' (Verdiği: '+q.o[i]+', Doğru: '+q.o[q.a]+')');bs[q.a].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q.a]+') '+q.o[q.a];msg.style.color='#e74c3c'}
const hn=document.getElementById('hn');hn.textContent='💡 '+q.h;hn.style.display='block';document.getElementById('au').style.display='block';
document.getElementById('next').style.display='block'}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function say(slow){stopA();A=new Audio('audio/gun25_q'+(k+1)+(slow?'_slow':'')+'.mp3');A.play()}
function nx(){stopA();k++;show()}
show();
</script><script src="report.js"></script></body></html>
