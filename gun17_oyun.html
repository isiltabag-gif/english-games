<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 17 Listening Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#ffecd2,#fcb69f);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #e67e22}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#e67e22;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#fff7ee;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#fff3e0}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#e67e22;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
.words{font-size:16px;background:#eef6ff;padding:10px;border-radius:12px;line-height:1.5}
.lis{font-size:19px;padding:10px 16px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}.hint{text-align:center;color:#777;font-size:15px;margin:4px}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[{"t": "🤫 Card 1: The Secret", "s": "Josh runs to his room. He tells JB about Dad's promise. JB is happy. \"Dad will see a doctor!\" he says. But Josh is still worried. He cannot sleep that night.", "q": [["Who does Josh tell?", ["Mom", "JB", "Coach", "Dad"], 1], ["How does JB feel?", ["Happy", "Angry", "Sleepy", "Hungry"], 0], ["What can Josh NOT do that night?", ["Eat dinner", "Read a book", "Play games", "Sleep"], 3], ["What is this card mostly about?", ["Josh tells JB about Dad's promise", "JB buys a new ball", "Mom goes to work", "The team wins a game"], 0]]}, {"t": "🏀 Card 2: In the Driveway", "s": "On Wednesday, Dad plays basketball with the twins in the driveway. He shows them a new move. Then he stops. He sits down and breathes hard. \"I'm OK,\" he says. \"Just a little tired.\"", "q": [["When does Dad play with the twins?", ["On Wednesday", "On Saturday", "On Monday", "On Sunday"], 0], ["Where do they play?", ["At school", "In the park", "In the driveway", "In the kitchen"], 2], ["What does Dad show them?", ["A new car", "A new move", "A new phone", "A new book"], 1], ["What is this card mostly about?", ["Dad plays, but he gets tired fast", "Dad buys new shoes", "The twins go to school", "Mom plays basketball"], 0]]}, {"t": "🍕 Card 3: Ready for Saturday", "s": "On Friday night, the team eats pizza at Coach's house. Coach says, \"Rest well tonight. Tomorrow, play together!\" Josh and JB give each other a high five. They are ready for the big game.", "q": [["When does the team eat pizza?", ["On Monday morning", "On Saturday", "After the game", "On Friday night"], 3], ["Where does the team eat pizza?", ["At school", "At Coach's house", "At the park", "At JB's house"], 1], ["What does Coach want them to do tonight?", ["Play more", "Watch TV", "Rest well", "Eat chips"], 2], ["What is this card mostly about?", ["The team gets ready for the big game", "Coach is sick", "JB loses his phone", "Josh cooks pizza"], 0]]}];
let k=-1,j=0,score=0,total=12,wrong=[];const c=document.getElementById('c');
function show(){if(k>=S.length)stopA();if(k<0){c.innerHTML=`<h2>🎧 Day 17: Getting Ready</h2><p class="story">Josh heard Dad's promise on the stairs. 🤫 Now the big game is coming on Saturday! 🏆 Today you only LISTEN! The story is hidden. 🎧</p><p class="words"><b>🔑 Yeni kelimeler:</b><br>tell = anlatmak · worried = endişeli · sleep = uyumak<br>driveway = evin önündeki yol · move = hareket · breathe hard = nefes nefese kalmak<br>tired = yorgun · rest = dinlenmek · together = birlikte<br>high five = çak bir beşlik · ready = hazır</p><p class="hint">3 kart · 12 soru · her doğru = ⭐ · 🔊 normal, 🐢 yavaş</p><button id="next" style="display:block;margin-top:12px" onclick="k=0;show()">Başla ▶️</button>`;return}
if(k>=S.length){c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=10?'Süpersin! Kulakların şampiyon gibi! 🎉':score>=7?'Çok iyi! Josh gibi hiç pes etmiyorsun! 👏':'Dinlemek her gün kolaylaşıyor! Yarın daha da güçlü olacaksın! 💪'}<br><br><span style="font-size:16px;color:#555">Sence takım cumartesi yarı finali kazanacak mı? 🏀🤔</span></div><button id="next" style="display:block" onclick="k=0;j=0;score=0;wrong=[];show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`;return}
const x=S[k],q=x.q[j];
c.innerHTML=`<div class="top"><span>Kart ${k+1}/3 · Soru ${j+1}/4</span><span>⭐ ${score}</span></div><h2>${x.t}</h2><div style="text-align:center;margin:8px 0"><button class="lis" onclick="say(0)">🔊 Dinle</button> <button class="lis" onclick="say(1)">🐢 Yavaş dinle</button></div><p class="hint">🎧 Metin gizli! Önce dinle, sonra cevapla. (İstediğin kadar tekrar dinleyebilirsin.)</p><p class="story" id="st" style="display:none">${x.s}</p><p class="q">${q[0]}</p>`+
q[1].map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><button id="next" onclick="nx()">Sonraki ➡️</button>`}
function ans(b,i){const q=S[k].q[j],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q[2]){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Kart '+(k+1)+' Soru '+(j+1)+': '+q[0]+' (Verdiği: '+q[1][i]+', Doğru: '+q[1][q[2]]+')');bs[q[2]].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q[2]];msg.style.color='#e74c3c'}
document.getElementById('next').style.display='block';document.getElementById('st').style.display='block'}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function say(slow){stopA();A=new Audio('audio/gun17_card'+(k+1)+(slow?'_slow':'')+'.mp3');A.play()}
function nx(){stopA();j++;if(j>=4){j=0;k++}show()}
show();
</script><script src="report.js"></script></body></html>
