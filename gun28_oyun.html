<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 28 Speaking + Weekly Review</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#fbc2eb,#a6c1ee);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #8e44ad}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#8e44ad;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#f5eefa;padding:12px;border-radius:12px}
.tag{display:inline-block;background:#f5eefa;color:#8e44ad;border-radius:10px;padding:3px 10px;font-size:14px;font-weight:bold}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#f5eefa}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next,.btn{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#8e44ad;color:#fff;cursor:pointer}
.btn{display:block;margin-top:10px}
.big{text-align:center;font-size:24px}
.lis{font-size:17px;padding:10px 14px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}
.hint{text-align:center;color:#777;font-size:15px;margin:4px}
.write{font-size:17px;line-height:1.5;background:#fff8e7;padding:12px;border-radius:12px}
.sample{font-size:17px;line-height:1.5;background:#e8f8f5;padding:12px;border-radius:12px;margin-top:10px;display:none}
.words{font-size:16px;background:#eef6ff;padding:10px;border-radius:12px;line-height:1.5}
</style></head><body><div class="card" id="c"></div>
<script>
const Q=[{"t": "🔁 Tekrar: Okuma (Gün 23)", "q": "Where does Alexis sit?", "o": ["Next to Josh", "Next to Coach", "Next to JB", "At the door"], "c": 2}, {"t": "🔁 Tekrar: Okuma (Gün 23)", "q": "When is the final (Coach says in Day 23)?", "o": ["Tomorrow", "In two weeks", "On Monday", "Next year"], "c": 1}, {"t": "🎧 Tekrar: Dinleme (Gün 24)", "l": "card2", "s": "At dinner, JB looks at his phone. He is texting Alexis. Mom says, \"No phones at the table, JB!\"", "q": "Who is JB texting?", "o": ["Coach", "Dad", "Alexis", "Josh"], "c": 2}, {"t": "🎧 Tekrar: Dinleme (Gün 24)", "l": "card3", "s": "At practice, JB waves to Alexis and misses the pass. Coach shouts, \"JB! Eyes on the ball!\"", "q": "What does Coach shout?", "o": ["Good job!", "Go home!", "JB! Eyes on the ball!", "Time for pizza!"], "c": 2}, {"t": "🔁 Tekrar: Dilbilgisi (Gün 25)", "q": "Yesterday, Josh ___ basketball with JB.", "o": ["play", "played", "plays", "playing"], "c": 1}, {"t": "🔁 Tekrar: Dilbilgisi (Gün 25)", "q": "JB ___ an easy shot. Oh no!", "o": ["miss", "misses", "missing", "missed"], "c": 3}, {"t": "🔁 Tekrar: Kelime (Gün 26)", "q": "\"jealous\" ne demek?", "o": ["kıskanç", "mutlu", "yorgun", "aç"], "c": 0}, {"t": "🔁 Tekrar: Kelime (Gün 26)", "q": "\"apologize\" ne demek?", "o": ["kazanmak", "özür dilemek", "şut atmak", "beklemek"], "c": 1}, {"t": "🔁 Tekrar: Okuma (Gün 27)", "q": "What does Coach say when the twins practice well?", "o": ["Go home now", "You are late", "This is a real team", "Stop playing"], "c": 2}, {"t": "🔁 Tekrar: Okuma (Gün 27)", "q": "How does the family feel about the twins?", "o": ["Angry", "Sad", "Proud", "Bored"], "c": 2}, {"t": "🏀 Yeni Kart: Ready for Tomorrow", "s": "On Friday night, Josh and JB sit on the couch. They talk about the final tomorrow. Mom brings apples and water. Dad walks slowly around the living room. He says, \"Play as a team. I will be there.\" The twins bump fists and smile. They are ready.", "a": "card1", "q": "What does Dad say?", "o": ["Go to bed now", "Play as a team. I will be there.", "No more basketball", "Call Alexis"], "c": 1}, {"t": "🏀 Yeni Kart: Ready for Tomorrow", "s": "On Friday night, Josh and JB sit on the couch. They talk about the final tomorrow. Mom brings apples and water. Dad walks slowly around the living room. He says, \"Play as a team. I will be there.\" The twins bump fists and smile. They are ready.", "a": "card1", "q": "What is this card mostly about?", "o": ["The twins eat pizza alone", "Mom goes to the store", "Josh and JB get ready for the final", "Coach cancels the game"], "c": 2}];
const SP=[{"q": "What is your favorite sport? Why?", "tr": "En sevdiğin spor nedir? Neden?", "st": "My favorite sport is ___. I like it because ___.", "sa": "My favorite sport is basketball. I like it because it is fun."}, {"q": "Do you have a brother or a sister? What do you do together?", "tr": "Kardeşin var mı? Birlikte ne yaparsınız?", "st": "I have a ___. We ___ together.", "sa": "I have a brother. We play games together."}, {"q": "How do you feel when your team wins?", "tr": "Takımın kazanınca nasıl hissedersin?", "st": "When my team wins, I feel ___.", "sa": "When my team wins, I feel happy and proud!"}];
let k=-1,score=0,total=12,wrong=[],phase='quiz',sp=0,spk=0;const c=document.getElementById('c');
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function play(id,slow){stopA();A=new Audio('audio/gun28_'+id+(slow?'_slow':'')+'.mp3');A.play()}
function show(){
if(k<0){c.innerHTML=`<h2>🏆 Day 28: Weekly Review + Speaking</h2><p class="story">Bu hafta neler oldu? 👧 Alexis · 📱 Kaçırılan pas · ✏️ Past -ed · 🤝 Özür dilemek · 🏀 İyi antrenman · 🏆 Final yarın!</p><p class="words"><b>📋 Bugünün planı:</b><br>1️⃣ Haftanın tekrarı: 10 kısa soru (okuma, dinleme, dilbilgisi, kelime)<br>2️⃣ Hikâyenin devamı: 1 mini kart, 2 soru 🛋️<br>3️⃣ Konuşma görevi: 3 soru, telefonla kendini kaydet 🎤</p><p class="hint">12 soru · her doğru = ⭐ · sonra 🎤 3 konuşma</p><button id="next" style="display:block;margin-top:12px" onclick="k=0;show()">Başla ▶️</button>`;return}
if(phase==='speak'){const x=SP[sp];
c.innerHTML=`<div class="top"><span>🎤 Konuşma ${sp+1}/3</span><span>⭐ ${score}/${total}</span></div><h2>🎤 Konuşma Görevi</h2>${sp===0?`<p class="write">📱 <b>Telefonunun ses kaydını aç</b> (Ses Kaydedici / Sesli Notlar).<br>Her soruyu 🔊 dinle, sonra <b>yüksek sesle</b> 1–2 cümleyle cevap ver. Takılırsan 💡 Yardım'a bas. Mükemmel olmak zorunda değil, denemek yeter! 💪</p>`:''}<div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('q${sp+1}',0)">🔊 Soruyu dinle</button> <button class="lis" onclick="play('q${sp+1}',1)">🐢 Yavaş dinle</button></div><p class="q">${x.q}</p><p class="hint">(${x.tr})</p><div class="sample" id="samp"><b>🧩 Kalıp:</b> ${x.st}<br><b>💡 Örnek:</b> ${x.sa}<br><button class="lis" onclick="play('a${sp+1}',0)">🔊 Örneği dinle</button> <button class="lis" onclick="play('a${sp+1}',1)">🐢 Yavaş</button></div><div id="msg"></div><button class="btn" style="background:#f39c12" onclick="document.getElementById('samp').style.display='block'">💡 Yardım</button><button class="btn" style="background:#27ae60" onclick="said()">✅ Cevabımı söyledim / kaydettim</button>`;return}
if(k>=Q.length){stopA();phase='speak';sp=0;show();return}
const x=Q[k];let mid='';
if(x.l){mid=`<p class="hint">🎧 Metin gizli! Sadece dinle 🤫</p><div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('${x.l}',0)">🔊 Dinle</button> <button class="lis" onclick="play('${x.l}',1)">🐢 Yavaş dinle</button></div><p class="story" id="hid" style="display:none">${x.s}</p>`}
else if(x.s){mid=`<p class="story">${x.s}</p><div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('${x.a}',0)">🔊 Dinle</button> <button class="lis" onclick="play('${x.a}',1)">🐢 Yavaş dinle</button></div>`}
else if(k===0){mid=`<p class="hint">Bu hafta öğrendiklerini hatırla! 🧠</p>`}
c.innerHTML=`<div class="top"><span>Soru ${k+1}/${Q.length}</span><span>⭐ ${score}</span></div><h2>${x.t}</h2>`+mid+`<p class="q">${x.q}</p>`+
x.o.map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><button id="next" onclick="nx()">Sonraki ➡️</button>`}
function ans(b,i){const x=Q[k],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===x.c){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Soru '+(k+1)+': '+x.q+' (Verdiği: '+x.o[i]+', Doğru: '+x.o[x.c]+')');bs[x.c].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[x.c]+') '+x.o[x.c];msg.style.color='#e74c3c'}
const h=document.getElementById('hid');if(h)h.style.display='block';
document.getElementById('next').style.display='block'}
function said(){stopA();spk++;sp++;if(sp>=SP.length){finish()}else{show()}}
function finish(){stopA();phase='done';
c.innerHTML=`<div class="big">🏆 Haftayı bitirdin!<br><br>⭐ ${score} / ${total}<br><br>${score>=10?'Süpersin! Bu haftanın şampiyonu sensin! 🎉':score>=7?'Çok iyi! Josh gibi hiç pes etmiyorsun! 👏':'Aferin, haftayı bitirdin! Her gün daha güçlüsün! 💪'}<br><br><span style="font-size:16px;color:#555">Tekrar + okuma: ${score}/${total} · Konuşma: ${spk}/3 🎤<br>Final yarın! Josh ve JB hazır. Sen de hazırsın mı? 🏀🏆</span><br><span style="font-size:16px;color:#8e44ad">📱 Ses kaydını anneye göndermeyi unutma!</span></div><button id="next" style="display:block" onclick="k=0;score=0;wrong=[];sp=0;spk=0;phase='quiz';show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`}
function send(){const t=txt()[1];location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+'\n🎤 Konuşma: '+spk+'/3'+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
function nx(){stopA();k++;show()}
show();
</script>
<script src="report.js"></script>
</body></html>
