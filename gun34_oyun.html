<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 34 Reading + Writing Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#a8edea,#fed6e3);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #16a085}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#16a085;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#e8f8f5;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#e8f8f5}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#16a085;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
.lis{font-size:17px;padding:10px 14px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}
.hint{text-align:center;color:#777;font-size:15px;margin:4px}
.words{font-size:16px;background:#eef6ff;padding:10px;border-radius:12px;line-height:1.5}
.write{font-size:18px;line-height:1.5;background:#fff8e7;padding:12px;border-radius:12px}
textarea{width:100%;min-height:110px;font-size:17px;padding:10px;border:2px solid #ddd;border-radius:12px;box-sizing:border-box;font-family:Arial,sans-serif}
.sample{font-size:17px;line-height:1.5;background:#e8f8f5;padding:12px;border-radius:12px;margin-top:10px;display:none}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[{"t": "🏀 Card 1: The Last Practice", "s": "It is Friday. The final is tomorrow! The team has a short practice. Josh wears his new red headband. He makes five shots in a row. Coach says, \"Good job! Now go home and rest.\"", "q": [["What day is it?", ["Monday", "Friday", "Sunday", "Saturday"], 1], ["What does Josh wear?", ["A black hat", "A new red headband", "Big glasses", "A blue scarf"], 1], ["How many shots does Josh make in a row?", ["Two", "Ten", "Five", "Zero"], 2], ["What is this card mostly about?", ["The last short practice before the final", "Josh loses his headband", "Coach is angry", "The team plays the final"], 0]]}, {"t": "🍝 Card 2: Dinner with Dad", "s": "At home, Mom makes pasta for dinner. Dad eats slowly. He looks at the twins and says, \"Tomorrow, play with your heart. Help your brother. Play as one team.\" Josh and JB nod.", "q": [["What does Mom make for dinner?", ["Pizza", "Soup", "Pasta", "Chicken"], 2], ["How does Dad eat?", ["Fast", "Slowly", "Not at all", "Standing up"], 1], ["What does Dad say?", ["Go to bed now", "Play with your heart", "Stay home tomorrow", "Watch TV"], 1], ["What is this card mostly about?", ["Mom cooks a new food", "Dad gives the twins good advice", "JB is hungry", "Dad plays basketball"], 1]]}, {"t": "🌙 Card 3: A Long Night", "s": "At night, Josh cannot sleep. He looks at the ceiling. JB whispers, \"Are you nervous?\" Josh says, \"Yes, a little.\" JB says, \"Me too. But we are a team.\" They laugh and fall asleep.", "q": [["What is Josh's problem at night?", ["He is hungry", "He cannot sleep", "He is sick", "He loses his ball"], 1], ["How does Josh feel?", ["A little nervous", "Very angry", "Bored", "Sleepy and happy"], 0], ["What does JB say?", ["Go away", "We are a team", "I want pizza", "Turn on the light"], 1], ["What is this card mostly about?", ["The brothers talk and feel better before the final", "JB cuts Josh's hair again", "Mom reads a book", "The twins play a video game"], 0]]}];
let k=-1,j=0,score=0,total=12,wrong=[],phase='read';const c=document.getElementById('c');
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function play(id,slow){stopA();A=new Audio('audio/gun34_'+id+(slow?'_slow':'')+'.mp3');A.play()}
function show(){
if(k<0){c.innerHTML=`<h2>🌙 Day 34: The Night Before the Final</h2><p class="story">Josh has a new red headband and a big dream. 🏀 The final is TOMORROW! 🏆 Today: the last practice, a special dinner with Dad, and a long night... 🌙 Read, listen and find out!</p><p class="words"><b>🔑 Yeni kelimeler:</b><br>tomorrow = yarın · short = kısa · headband = saç bandı · in a row = arka arkaya · rest = dinlenmek<br>slowly = yavaşça · heart = kalp · advice = tavsiye · nod = başını sallamak (evet)<br>ceiling = tavan · whisper = fısıldamak · nervous = heyecanlı, gergin · fall asleep = uykuya dalmak</p><p class="hint">3 kart · 12 soru · her doğru = ⭐ · sonra kısa yazma ✏️</p><button id="next" style="display:block;margin-top:12px" onclick="k=0;show()">Başla ▶️</button>`;return}
if(phase==='write'){c.innerHTML=`<div class="top"><span>✏️ Yazma</span><span>⭐ ${score}/${total}</span></div><h2>✏️ Kısa Yazma</h2><p class="write"><b>Finalden önceki gece Josh nasıl hissediyor? Sen büyük bir maçtan ya da sınavdan önceki gece ne yaparsın? 2–3 kısa cümle yaz.</b><br><span style="color:#777">İpucu: Josh feels... · Before a big day, I... · I go to bed...</span></p><textarea id="w" placeholder="Josh feels..."></textarea><div id="msg"></div><div class="sample" id="samp"><b>💡 Örnek cevap:</b><br>Josh feels nervous and excited. Before a big day, I eat a good dinner. I go to bed early.</div><button id="next" style="display:block;margin-top:10px" onclick="showSample()">💡 Örneği göster</button><button id="next" style="display:block;margin-top:10px;background:#27ae60" onclick="finishWrite()">Bitir ➡️</button>`;return}
if(k>=S.length){phase='write';show();return}
const x=S[k],q=x.q[j];
c.innerHTML=`<div class="top"><span>Kart ${k+1}/3 · Soru ${j+1}/4</span><span>⭐ ${score}</span></div><h2>${x.t}</h2><p class="story">${x.s}</p><div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('card'+(k+1),0)">🔊 Dinle</button> <button class="lis" onclick="play('card'+(k+1),1)">🐢 Yavaş dinle</button></div><p class="q">${q[0]}</p>`+
q[1].map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><button id="next" onclick="nx()">Sonraki ➡️</button>`
}
function ans(b,i){const q=S[k].q[j],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q[2]){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Kart '+(k+1)+' Soru '+(j+1)+': '+q[0]+' (Verdiği: '+q[1][i]+', Doğru: '+q[1][q[2]]+')');bs[q[2]].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q[2]];msg.style.color='#e74c3c'}
document.getElementById('next').style.display='block'}
function showSample(){document.getElementById('samp').style.display='block'}
function finishWrite(){stopA();phase='done';
c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=10?'Süpersin! Finale hazır bir şampiyon gibisin! 🏆🎉':score>=7?'Çok iyi! Josh gibi kalbinle oynuyorsun! 👏':'Aferin, bitirdin! Biraz heyecan normal — yarın daha da güçlü olacaksın! 💪'}<br><br><span style="font-size:16px;color:#555">Okuma: ${score}/12 · Yazma: pratik ✅<br>Yarın büyük final! 🏆 Josh ve JB hazır — sen de harika bir haftayı bitirdin! 🌟</span></div><button id="next" style="display:block" onclick="k=0;j=0;score=0;wrong=[];phase='read';show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
function nx(){stopA();j++;if(j>=4){j=0;k++}show()}
show();
</script><script src="report.js"></script></body></html>
