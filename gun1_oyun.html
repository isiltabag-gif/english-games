<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 1 Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#ffecd2,#fcb69f);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #e67e22}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#e67e22;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#fff7ee;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#fff3e0}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#e67e22;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[
{t:"🏀 Card 1: The Twins",s:"Josh and Jordan are brothers. They are twins. They are twelve years old. They love basketball. Josh has long hair. Jordan has no hair. People call Jordan \"JB\".",
q:[["Who are Josh and Jordan?",["Friends","Cousins","Twin brothers","Teachers"],2],["How old are they?",["Ten","Twelve","Fifteen","Eight"],1],["What do they love?",["Football","Music","Swimming","Basketball"],3],["Who has long hair?",["Josh","JB","Dad","Mom"],0]]},
{t:"🏀 Card 2: Dad",s:"The boys' father is Chuck Bell. He was a basketball player before. Now he is at home. He plays basketball with his sons in the yard. He is a happy and funny man.",
q:[["What is the father's name?",["Josh","Chuck","Jordan","Tom"],1],["What was his job before?",["Doctor","Teacher","Basketball player","Driver"],2],["Where does he play with his sons?",["In the yard","At school","In the kitchen","At the beach"],0],["What kind of man is he?",["Sad and angry","Quiet and shy","Lazy","Happy and funny"],3]]},
{t:"🏀 Card 3: Mom",s:"The boys' mother is Crystal Bell. She works at the boys' school. She is a strict mom. Homework is very important to her. She says: \"First homework, then basketball!\"",
q:[["Where does Mom work?",["At a hospital","At the boys' school","At a shop","At home"],1],["What kind of mom is she?",["Strict","Lazy","Funny","Angry"],0],["What is very important to her?",["Games","Money","Homework","TV"],2],["What comes first for the boys?",["Basketball","Dinner","Sleep","Homework"],3]]}];
let k=0,j=0,score=0,total=12,wrong=[];const c=document.getElementById('c');
function show(){if(k>=S.length){c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=10?'Süpersin! 🎉':score>=7?'Çok iyi! 👏':'Yarın daha iyi olacak! 💪'}</div><button id="next" style="display:block" onclick="k=0;j=0;score=0;wrong=[];show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">📧 Sonucu anneme e-postayla gönder</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`;return}
const x=S[k],q=x.q[j];
c.innerHTML=`<div class="top"><span>Kart ${k+1}/3 · Soru ${j+1}/4</span><span>⭐ ${score}</span></div><h2>${x.t}</h2><p class="story">${x.s}</p><p class="q">${q[0]}</p>`+
q[1].map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><button id="next" onclick="nx()">Sonraki ➡️</button>`}
function ans(b,i){const q=S[k].q[j],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q[2]){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Kart '+(k+1)+' Soru '+(j+1)+': '+q[0]+' (Verdiği: '+q[1][i]+', Doğru: '+q[1][q[2]]+')');bs[q[2]].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q[2]];msg.style.color='#e74c3c'}
document.getElementById('next').style.display='block'}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();location.href='mailto:isiltabag@gmail.com?subject='+encodeURIComponent('English Games sonucu - '+d)+'&body='+encodeURIComponent(t)}
function nx(){j++;if(j>=4){j=0;k++}show()}
show();
</script></body></html>
