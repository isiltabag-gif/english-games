<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 9 Reading Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#fbd786,#f7797d);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #e67e22}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#e67e22;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#fff3e0;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#fff3e0}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#e67e22;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
.lis{font-size:17px;padding:10px 14px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}
.hint{text-align:center;color:#777;font-size:15px;margin:4px}
.words{font-size:16px;background:#eef6ff;padding:10px;border-radius:12px;line-height:1.5}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[
{t:"🏀 Card 1: One-on-One",s:"The next day JB comes to the yard. He says, \"Let's play, Josh.\" Josh smiles. The brothers play one-on-one. Dad watches them and laughs.",
q:[["Who comes to the yard?",["Mom","JB","Alexis","The coach"],1],["What does JB say?",["Let's play, Josh.","Go home, Josh.","I am hungry.","Where is Mom?"],0],["Who watches them?",["Alexis","Mom","The coach","Dad"],3],["What is this card mostly about?",["Mom cooks lunch","Josh goes to the library","The brothers play basketball together again","Alexis comes to the yard"],2]]},
{t:"🏀 Card 2: The Bet",s:"JB says, \"Let's make a bet. If I win, I cut a little piece of your hair.\" Josh loves his long hair. But he says, \"Okay. I never lose!\" The game starts.",
q:[["What does JB want to cut?",["Josh's shoes","Josh's hair","Dad's hair","Mom's book"],1],["What does Josh love?",["His long hair","His new bike","His homework","His phone"],0],["What does Josh say?",["No, thank you.","I am tired.","Okay. I never lose!","Let's eat dinner."],2],["What is this card mostly about?",["Dad goes to the doctor","Mom reads a book","Josh cuts JB's hair","JB and Josh make a bet before the game"],3]]},
{t:"🏀 Card 3: Oh No, My Hair!",s:"JB wins the game. He takes the scissors. He wants to cut a little hair, but he cuts too much! Josh looks in the mirror. He is very angry. JB says, \"Sorry, Josh!\"",
q:[["Who wins the game?",["Josh","Dad","JB","Nobody"],2],["What does JB take?",["The ball","The scissors","A book","A phone"],1],["How does Josh feel?",["Happy","Hungry","Sleepy","Very angry"],3],["What is this card mostly about?",["The boys win a school game","JB cuts too much of Josh's hair","Mom buys new shoes","Dad plays with Alexis"],1]]}];
let k=-1,j=0,score=0,total=12,wrong=[];const c=document.getElementById('c');
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function play(id,slow){stopA();A=new Audio('audio/gun9_'+id+(slow?'_slow':'')+'.mp3');A.play()}
function show(){
if(k<0){c.innerHTML=`<h2>🏀 Day 9: The Bet</h2><p class="story">Josh and JB are friends again... or are they? 🤔 Today the twins play one-on-one and make a funny bet.</p><p class="words"><b>🔑 Yeni kelimeler:</b><br>one-on-one = bire bir maç · bet = iddia<br>a little piece = küçük bir parça · scissors = makas<br>too much = çok fazla · mirror = ayna</p><p class="hint">3 kart · 12 soru · her doğru = ⭐</p><button id="next" style="display:block;margin-top:12px" onclick="k=0;show()">Başla ▶️</button>`;return}
if(k>=S.length){finish();return}
const x=S[k],q=x.q[j];
c.innerHTML=`<div class="top"><span>Kart ${k+1}/3 · Soru ${j+1}/4</span><span>⭐ ${score}</span></div><h2>${x.t}</h2><p class="story">${x.s}</p><div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('card'+(k+1),0)">🔊 Dinle</button> <button class="lis" onclick="play('card'+(k+1),1)">🐢 Yavaş dinle</button></div><p class="q">${q[0]}</p>`+
q[1].map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><button id="next" onclick="nx()">Sonraki ➡️</button>`
}
function ans(b,i){const q=S[k].q[j],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q[2]){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Kart '+(k+1)+' Soru '+(j+1)+': '+q[0]+' (Verdiği: '+q[1][i]+', Doğru: '+q[1][q[2]]+')');bs[q[2]].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q[2]];msg.style.color='#e74c3c'}
document.getElementById('next').style.display='block'}
function finish(){stopA();
c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=10?'Süpersin! Gerçek bir okuma şampiyonusun! 🎉':score>=7?'Çok iyi! Josh gibi hiç pes etmiyorsun! 👏':'Her gün biraz daha iyi! Yarın daha da güçlü olacaksın! 💪'}<br><br><span style="font-size:16px;color:#555">Sence Josh, JB'yi affedecek mi? Yarın göreceğiz! 🤔</span></div><button id="next" style="display:block" onclick="k=0;j=0;score=0;wrong=[];show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
function nx(){stopA();j++;if(j>=4){j=0;k++}show()}
show();
</script><script src="report.js"></script></body></html>
