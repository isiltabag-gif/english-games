<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossover Day 12 Vocabulary Game</title>
<style>
body{font-family:Arial,sans-serif;background:linear-gradient(#e0c3fc,#8ec5fc);margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 24px #0003;width:92%;max-width:560px;padding:22px;border-top:12px solid #8e44ad}
.top{display:flex;justify-content:space-between;font-weight:bold;color:#555}
h2{color:#8e44ad;margin:8px 0}.story{font-size:19px;line-height:1.6;background:#f8f0ff;padding:12px;border-radius:12px}
.q{font-size:19px;font-weight:bold;margin:14px 0 8px}
button.opt{display:block;width:100%;text-align:left;font-size:18px;margin:7px 0;padding:12px;border:2px solid #ddd;border-radius:12px;background:#fafafa;cursor:pointer}
button.opt:hover{background:#f5eaff}.ok{background:#c8f7c5!important;border-color:#27ae60!important}.no{background:#ffd0d0!important;border-color:#e74c3c!important}
#msg{font-size:20px;font-weight:bold;text-align:center;min-height:28px;margin:8px}
#next{display:none;width:100%;font-size:20px;padding:12px;border:none;border-radius:12px;background:#8e44ad;color:#fff;cursor:pointer}
.big{text-align:center;font-size:24px}
.bl{color:#8e44ad;font-weight:bold}.exp{font-size:17px;line-height:1.6;background:#eef6ff;padding:12px;border-radius:12px;text-align:left}.lis{font-size:19px;padding:10px 16px;border:none;border-radius:12px;background:#3498db;color:#fff;cursor:pointer;margin:3px}.hint{text-align:center;color:#777;font-size:15px;margin:4px}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.wc{background:#f8f0ff;border:2px solid #e0c8f5;border-radius:12px;padding:8px;text-align:center;cursor:pointer;font-size:17px}.wc b{font-size:20px;color:#8e44ad}.wc.seen{border-color:#27ae60;background:#eafbea}
</style></head><body><div class="card" id="c"></div>
<script>
const S=[{"title": "🔤 \"bench\" ne demek?", "s": "Josh can't play. He sits on the <b>bench</b>.", "o": ["pencere", "yedek kulübesi (bank)", "sınıf", "ayakkabı"], "a": 1, "h": "bench = yedek kulübesi / bank (oynamayan oyuncular burada oturur)"}, {"title": "🔤 \"fans\" ne demek?", "s": "The <b>fans</b> clap and cheer for the team.", "o": ["taraftarlar", "öğretmenler", "kardeşler", "doktorlar"], "a": 0, "h": "fans = taraftarlar (fan = taraftar)"}, {"title": "🔤 \"points\" ne demek?", "s": "JB gets twenty <b>points</b> in the game.", "o": ["ayakkabılar", "oyuncular", "sayılar (puan)", "takımlar"], "a": 2, "h": "points = sayılar / puan (point = sayı)"}, {"title": "🔤 \"lose\" ne demek?", "s": "The team plays well, but they <b>lose</b> the game.", "o": ["kazanmak", "başlamak", "izlemek", "kaybetmek"], "a": 3, "h": "lose = kaybetmek (win = kazanmak'ın tersi!)"}, {"title": "🔤 \"hurt\" ne demek?", "s": "Josh throws the ball very hard. He <b>hurts</b> JB.", "o": ["incitmek, canını acıtmak", "yardım etmek", "aramak", "beklemek"], "a": 0, "h": "hurt = incitmek / canını acıtmak"}, {"title": "🔤 \"sorry\" ne demek?", "s": "Josh says, \"I am <b>sorry</b>, JB.\"", "o": ["teşekkürler", "özür dilerim / üzgünüm", "merhaba", "güle güle"], "a": 1, "h": "sorry = özür dilerim / üzgünüm → I am sorry!"}, {"title": "🔤 \"sarılmak\" İngilizcesi hangisi?", "s": "🤗 The brothers ___ . <br><small>(İki kardeş birbirine sarılıyor.)</small>", "o": ["kick", "jump", "run", "hug"], "a": 3, "h": "hug = sarılmak → The brothers hug."}, {"title": "🔤 \"affetmek\" İngilizcesi hangisi?", "s": "JB is not angry now. He says, \"I <span class='bl'>___</span> you, Josh.\"", "o": ["forgive", "hurt", "lose", "miss"], "a": 0, "h": "forgive = affetmek → I forgive you!"}, {"title": "✏️ Boşluğa hangi kelime gelir?", "s": "JB wants to play with Josh again. He <span class='bl'>___</span> his brother.", "o": ["hurts", "loses", "misses", "forgives"], "a": 2, "h": "miss = özlemek → JB misses his brother."}, {"title": "✏️ Boşluğa hangi kelime gelir?", "s": "Dad sees the boys hug. He smiles. He is <span class='bl'>___</span> of his sons.", "o": ["angry", "sorry", "hungry", "proud"], "a": 3, "h": "proud = gurur duyan → Dad is proud of his sons."}];
const W=[{"w": "bench", "t": "yedek kulübesi (bank)", "e": "🪑"}, {"w": "fans", "t": "taraftarlar", "e": "📣"}, {"w": "points", "t": "sayılar (puan)", "e": "🔢"}, {"w": "lose", "t": "kaybetmek", "e": "😞"}, {"w": "hurt", "t": "incitmek, canını acıtmak", "e": "🤕"}, {"w": "sorry", "t": "özür dilerim / üzgünüm", "e": "🙏"}, {"w": "hug", "t": "sarılmak", "e": "🤗"}, {"w": "forgive", "t": "affetmek", "e": "🕊️"}, {"w": "miss", "t": "özlemek", "e": "💭"}, {"w": "proud", "t": "gurur duyan", "e": "🏅"}];
const STORY="Today the team has a big game. But Josh can't play. He sits on the bench. The fans are loud. JB gets twenty points, but the team loses. After the game, Josh says, &quot;I am sorry, JB. I hurt you.&quot; JB says, &quot;I miss my brother.&quot; Then he smiles. &quot;I forgive you, Josh.&quot; The brothers hug. Dad is proud of his sons.";
let k=-2,score=0,total=10,wrong=[];const c=document.getElementById('c');
function show(){if(k===-2){c.innerHTML=`<h2>🏀 Day 12: On the Bench</h2><p class="story">${STORY}</p><div style="text-align:center;margin:6px 0"><button class="lis" onclick="play('story',0)">🔊 Dinle</button> <button class="lis" onclick="play('story',1)">🐢 Yavaş dinle</button></div><div class="exp"><b>🔤 Bugün 10 yeni kelime!</b><br>1️⃣ Hikâyeyi oku ve dinle.<br>2️⃣ Kelime kartlarına dokun, dinle ve yüksek sesle tekrar et 🗣️<br>3️⃣ Sonra 10 soruyu çöz ve yıldızları topla! ⭐</div><button id="next" style="display:block;margin-top:12px" onclick="k=-1;show()">Kelime kartları ▶️</button>`;return}
if(k===-1){c.innerHTML=`<h2>🃏 Kelime Kartları</h2><p class="hint">Her karta dokun 👆 → dinle → yüksek sesle söyle!</p><div class="wl">`+W.map((w,i)=>`<div class="wc" id="w${i}" onclick="play('word'+(${i}+1),0);this.classList.add('seen')">${w.e} <b>${w.w}</b><br>${w.t} 🔊</div>`).join('')+`</div><button id="next" style="display:block;margin-top:12px" onclick="stopA();k=0;show()">Oyunu başlat ▶️</button>`;return}
if(k>=S.length){c.innerHTML=`<div class="big">🏆 Bitti!<br><br>⭐ ${score} / ${total}<br><br>${score>=8?'Süpersin! 10 yeni kelime artık senin! 🎉':score>=6?'Çok iyi! Kelimeleri neredeyse öğrendin! 👏':'Aferin, bitirdin! Yarın daha iyi olacak! 💪'}</div><button id="next" style="display:block" onclick="k=0;score=0;wrong=[];show()">🔁 Tekrar oyna</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="mail()">❤️ Sonucu güzel anneme gönder ❤️</button><button id="next" style="display:block;margin-top:10px;background:#25D366" onclick="send()">💬 WhatsApp ile gönder</button>`;return}
const q=S[k];
c.innerHTML=`<div class="top"><span>Soru ${k+1}/${S.length}</span><span>⭐ ${score}</span></div><h2>${q.title}</h2><p class="story">${q.s}</p>`+
q.o.map((o,i)=>`<button class="opt" onclick="ans(this,${i})">${'ABCD'[i]}) ${o}</button>`).join('')+`<div id="msg"></div><p class="hint" id="hn" style="display:none"></p><div id="au" style="text-align:center;display:none;margin:6px 0"><button class="lis" onclick="say(0)">🔊 Dinle ve tekrar et</button> <button class="lis" onclick="say(1)">🐢 Yavaş dinle</button></div><button id="next" onclick="nx()">Sonraki ➡️</button>`}
function ans(b,i){const q=S[k],bs=document.querySelectorAll('.opt');bs.forEach(e=>e.disabled=true);
if(i===q.a){b.classList.add('ok');score++;msg.textContent='✅ Doğru! Harika!';msg.style.color='#27ae60'}
else{b.classList.add('no');wrong.push('Soru '+(k+1)+': '+q.s.replace(/<[^>]+>/g,'')+' (Verdiği: '+q.o[i]+', Doğru: '+q.o[q.a]+')');bs[q.a].classList.add('ok');msg.textContent='❌ Yanlış. Doğru cevap: '+'ABCD'[q.a]+') '+q.o[q.a];msg.style.color='#e74c3c'}
const hn=document.getElementById('hn');hn.textContent='💡 '+q.h;hn.style.display='block';document.getElementById('au').style.display='block';
document.getElementById('next').style.display='block'}
function send(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];const t='📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉');location.href='https://wa.me/?text='+encodeURIComponent(t)}
function txt(){const day=(document.title.match(/Day \d+/)||[location.pathname.split('/').pop()])[0];return [day,'📚 '+day+'\n✅ Doğru: '+score+'\n❌ Yanlış: '+(total-score)+(wrong.length?'\n\nYanlışlar:\n'+wrong.join('\n'):'\n\nHepsi doğru! 🎉')]}
function mail(){const [d,t]=txt();const su=encodeURIComponent('English Games sonucu - '+d),bo=encodeURIComponent(t);if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){location.href='mailto:isiltabag@gmail.com?subject='+su+'&body='+bo}else{window.open('https://mail.google.com/mail/?view=cm&fs=1&to=isiltabag@gmail.com&su='+su+'&body='+bo,'_blank')}}
let A=null;function stopA(){if(A){A.pause();A.currentTime=0}}
function play(id,slow){stopA();A=new Audio('audio/gun12_'+id+(slow?'_slow':'')+'.mp3');A.play()}
function say(slow){play('card'+(k+1),slow)}
function nx(){stopA();k++;show()}
show();
</script><script src="report.js"></script></body></html>
